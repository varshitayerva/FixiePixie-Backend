spring.application.name=PaymentMicroservice
server.port=8084

#Database
spring.datasource.url=jdbc:postgresql://localhost:5432/PaymentsMicroservice
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 3. Eureka Client Configuration
# This allows the API Gateway and Booking Service to find the Payment Service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# 4. Jackson Serialization (To ensure Enums like Status are handled correctly)
spring.jackson.serialization.write-enums-using-to-string=true
