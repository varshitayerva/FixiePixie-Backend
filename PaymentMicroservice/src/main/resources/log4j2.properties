status = warn
name = PaymentServiceConfig
# 1. Console Appender for real-time tracking
appender.console.type = Console
appender.console.name = LogToConsole
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5p %c{1} - %m%n

# 2. Rolling File Appender for the /logs directory
appender.file.type = RollingFile
appender.file.name = LogToFile
appender.file.fileName = C:/Users/j.sebastian/Documents/FixiePixie-Backend-2/PaymentMicroservice/logs/payment-service.log
appender.file.filePattern = C:/Users/j.sebastian/Documents/FixiePixie-Backend-2/PaymentMicroservice/logs/payment-service-%d{yyyy-MM-dd}.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1

# 3. Root Logger
rootLogger.level = info
rootLogger.appenderRef.stdout.ref = LogToConsole
rootLogger.appenderRef.file.ref = LogToFile

# 4. Payment Specific Logger (Disabling additivity to avoid double logs)
logger.payment.name = com.gl.app.PaymentMicroservice
logger.payment.level = info
logger.payment.additivity = false
logger.payment.appenderRef.stdout.ref = LogToConsole
logger.payment.appenderRef.file.ref = LogToFile
