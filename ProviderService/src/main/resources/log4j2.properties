
# Name of the Properties file
name=ProviderServiceLoggerConfig

# ---------------- ROOT LOGGER ----------------
rootLogger.level=INFO
rootLogger.appenderRef.console.ref=ConsoleAppender
rootLogger.appenderRef.file.ref=FileAppender

# ---------------- PACKAGE LOGGER (YOUR PROJECT) ----------------
logger.provider.name=com.gl.project.ProviderService
logger.provider.level=DEBUG
logger.provider.appenderRef.console.ref=ConsoleAppender
logger.provider.appenderRef.file.ref=FileAppender
logger.provider.additivity=false

# ---------------- CONSOLE APPENDER ----------------
appender.console.type=Console
appender.console.name=ConsoleAppender
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%d{dd-MM-yyyy HH:mm:ss} [%t] %-5level %c - %m%n

# ---------------- FILE APPENDER ----------------
appender.file.type=File
appender.file.name=FileAppender

# ? IMPORTANT: Absolute path (fixes your issue)
appender.file.fileName=C:/logs/provider-service.log

# ? Append instead of overwrite
appender.file.append=true

appender.file.layout.type=PatternLayout
appender.file.layout.pattern=%d{dd-MM-yyyy HH:mm:ss} [%t] %-5level %c - %m%n
