spring.application.name=BookingService
# Server Configuration
server.port=2003

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/bookingdb
spring.datasource.username=postgres
spring.datasource.password=varsh

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- DISABLE EUREKA (STANDALONE MODE) ---
# This stops the "Connection refused" errors
eureka.client.enabled=false
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false



# Logging Configuration
logging.level.org.springframework=INFO
# Matches your package structure from the code you shared earlier
logging.level.com.gl.project.UserService=DEBUG
# Show SQL query parameters for easier debugging
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
